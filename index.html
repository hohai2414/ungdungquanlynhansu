</style><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" hidden></div><script>
function icon(name){const shapes={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-3-5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18M7 15h2M15 15h2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',requests:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h6"/>',report:'<path d="M4 3v18h17M8 17v-6M13 17V7M18 17V4"/>',settings:'<path d="m10 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3 3-1 1-3 3-1 1-3-2-2 1-3-3-2-2 1-2-3z"/><circle cx="12" cy="12" r="3"/>',field:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+shapes[name]+'</svg>'}

let D,view='Tổng quan',query='',filter='',calMode='tuần',calDate=''; const pages=['Tổng quan','Nhân sự','Lịch & Phân công','Chấm công','Yêu cầu','Báo cáo','Cài đặt'],icons=[icon('dashboard'),icon('users'),icon('calendar'),icon('clock'),icon('requests'),icon('report'),icon('settings')];const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(n),date=s=>s?new Date(s).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—',person=id=>D.people.find(p=>p.id===id)?.name||'Nhân sự #'+id,mgr=()=>['admin','manager'].includes(D.user.role),admin=()=>D.user.role==='admin';
async function api(url,b){const r=await fetch('/api/'+url,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const d=await r.json();if(!r.ok)throw Error(d.error);return d}function toast(t){$('#toast').hidden=false;$('#toast').className='toast';$('#toast').textContent=t;setTimeout(()=>$('#toast').hidden=true,4500)}async function act(b){try{D=await api('action',b);$('#modal').close();render();toast('Đã lưu thành công')}catch(e){toast(e.message)}}function tag(s){const c=s==='Hoàn thành'?'orange':['Đã duyệt','Đã nhận','Đã thanh toán','Đang hoạt động','Đang thực hiện'].includes(s)?'green':['Từ chối','Hủy','Ngừng hoạt động','Thiếu check-out','Quá hạn','Đi muộn','Chưa check-in'].includes(s)?'red':'info';return `<span class="tag ${c}"><span class="status-dot" aria-hidden="true"></span>${esc(s)}</span>`}function btn(t,fn,primary=false){return `<button class="${primary?(t.startsWith('+')?'accent':'primary'):''}" onclick="${fn}">${t}</button>`}function empty(){return '<div class="empty">Chưa có dữ liệu phù hợp. Thử thay đổi bộ lọc hoặc tạo bản ghi mới.</div>'}function show(v){view=v;query='';filter='';render()}function match(s){return !query||s.toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))}function modal(title,html,on){$('#modal').innerHTML=`<h2>${title}</h2><form id="form">${html}<div class="actions">${btn('Hủy',"document.querySelector('#modal').close()") }<button class="primary" type="submit">Lưu thông tin</button></div></form>`;$('#form').onsubmit=e=>{e.preventDefault();on(new FormData(e.target))};$('#form').querySelector('button').type='button';$('#modal').showModal()}function field(n,t,v='',type='text'){return `<label>${t}<input name="${n}" type="${type}" value="${esc(v)}"></label>`}function select(n,t,opts,val){return `<label>${t}<select name="${n}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`}const notes=()=>'<label>Ghi chú / lý do<textarea name="reason" required></textarea></label>';
function login(){ $('#app').innerHTML=`<div class="login"><div class="logo"><strong>UEH<span>■</span></strong><div>CORE HR<small>QUẢN LÝ NHÂN SỰ</small></div></div><h1>Chào mừng trở lại</h1><p class="muted">Một nơi để kết nối con người và công việc.</p><form id="login">${field('email','Email','user1@demo.vn','email')}${field('password','Mật khẩu','Demo@123','password')}<button class="primary" style="width:100%">Đăng nhập</button></form><p class="muted" style="font-size:12px">Dữ liệu minh họa · mật khẩu: Demo@123<br>HR: user1@demo.vn · Quản lý: user2@demo.vn<br>Nhân viên: user3@demo.vn · CTV: user21@demo.vn</p></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await api('login',Object.fromEntries(new FormData(e.target)));D=await api('data');render()}catch(e){toast(e.message)}}}
function render(){const count=D.requests.filter(x=>x.status==='Chờ duyệt').length;$('#app').innerHTML=`<aside><div class="logo"><strong>UEH<span>■</span></strong><div>CORE HR<small>QUẢN LÝ NHÂN SỰ</small></div></div><div class="eyebrow" style="margin:0 16px 15px">Không gian làm việc</div><nav class="nav">${pages.map((p,i)=>`<button class="${p===view?'active':''}" title="${p}" aria-label="${p}" aria-current="${p===view?'page':'false'}" onclick="show('${p}')"><i aria-hidden="true">${icons[i]}</i><span class="navlabel">${p}</span>${p==='Yêu cầu'&&count?' · '+count:''}</button>`).join('')}</nav><div class="sidefoot">● Bộ phận vận hành<br>${D.people.filter(p=>p.active).length} nhân sự đang hoạt động<br><br>Phiên bản MVP / Dữ liệu minh họa</div></aside><main><header><span class="muted">Bộ phận vận hành <span style="margin:0 12px">/</span> ${view}</span><div><span class="avatar">${esc(D.user.name.split(' ').slice(-1)[0][0])}</span><small>${esc(D.user.name)} · ${esc({admin:'HR',manager:'Điều phối',employee:'Nhân viên',contractor:'CTV'}[D.user.role])}</small> ${btn('Thoát','logout()')}</div></header><div class="content"><div class="intro"><div><div class="eyebrow">Con người & công việc</div><h1>${view==='Tổng quan'?'Chào '+esc(D.user.name.split(' ').slice(-2).join(' '))+' — tổng quan hôm nay':view}</h1><div class="muted">${view==='Tổng quan'?'Nắm bắt nhịp làm việc của đội ngũ, trong một cái nhìn.':'Quản lý tập trung, thao tác đơn giản.'}</div></div><div>${view==='Lịch & Phân công'&&mgr()?btn('+ Tạo ca làm','shiftForm()',true):view==='Nhân sự'&&admin()?btn('+ Thêm nhân sự','personForm()',true):view==='Yêu cầu'?btn('+ Gửi yêu cầu','requestForm()',true):`<span class="tag">${new Date().toLocaleDateString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',weekday:'long',day:'numeric',month:'long'})}</span>`}</div></div><div class="demo">◉ Dữ liệu minh họa — hồ sơ, ca làm và các con số dùng để trải nghiệm MVP.</div><div id="screen"></div></div></main>`;screen()}

function screen(){const el=$('#screen');if(view==='Tổng quan'){const today=D.shifts.filter(s=>s.start.slice(0,10)===D.today&&s.status!=='Hủy'),fieldIds=new Set(D.assignments.filter(a=>today.some(s=>s.id===a.shift&&s.location!=='Văn phòng')&&!['Hủy','Từ chối'].includes(a.status)).map(a=>a.person)),leave=D.requests.filter(r=>r.kind==='Nghỉ phép'&&r.status==='Đã duyệt'&&r.start<=D.today&&r.end>=D.today),pending=D.results.filter(r=>r.status==='Chờ duyệt');el.innerHTML=`<div class="stats">${[['Nhân sự hoạt động',D.people.filter(p=>p.active).length,icon('users'),'Nội bộ và cộng tác viên'],['Phân công hiện trường',fieldIds.size,icon('field'),'Người được giao ca hôm nay'],['Ca chưa đủ người',today.filter(s=>D.assignments.filter(a=>a.shift===s.id&&!['Từ chối','Hủy'].includes(a.status)).length<s.required).length,icon('calendar'),'Cần điều phối bổ sung'],['Chờ xác nhận',pending.length+D.attendance.filter(a=>a.status==='Chờ duyệt').length,icon('clock'),'Kết quả và bảng công']].map(x=>`<div class="stat"><span class="icon">${x[2]}</span><span class="muted">${x[0]}</span><div class="num">${x[1]}</div><small>${x[3]}</small></div>`).join('')}</div><div class="grid"><div><div class="panel"><div class="paneltop"><h2>Lịch làm việc hôm nay</h2>${btn('Xem lịch →',"show('Lịch & Phân công')")}</div>${today.map(s=>`<div class="row"><span class="avatar">↗</span><div class="body"><b>${esc(s.title)}</b><small>${date(s.start)} – ${date(s.end)} · ${esc(s.location)}</small></div>${tag(s.status)}</div>`).join('')||empty()}</div><div class="panel"><div class="paneltop"><h2>Cần bạn xử lý</h2>${btn('Xem yêu cầu →',"show('Yêu cầu')")}</div>${D.attendance.filter(a=>!a.checkout).map(a=>`<div class="row"><span class="tag red">Thiếu check-out</span><div class="body">${esc(person(a.person))}<small>${date(a.checkin)}</small></div></div>`).join('')}${pending.map(r=>`<div class="row"><span class="tag orange">Chờ duyệt kết quả</span><div class="body">${esc(D.shifts.find(s=>s.id===r.shift)?.title)}</div>${mgr() function calendar(ss){const base=new Date((calDate||D.today)+'T12:00:00+07:00');let n=calMode==='ngày'?1:calMode==='tuần'?7:new Date(base.getFullYear(),base.getMonth()+1,0).getDate();if(calMode==='tuần')base.setDate(base.getDate()-((base.getDay()+6)%7));if(calMode==='tháng')base.setDate(1);return Array.from({length:n},(_,i)=>{let d=new Date(base);d.setDate(d.getDate()+i);let key=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(d);return `<div class="calday"><b>${d.toLocaleDateString('vi-VN',{weekday:'short',day:'numeric',month:'numeric'})}</b>${ss.filter(s=>s.start.slice(0,10)===key).map(s=>`<div class="tag orange" onclick="taskDetail(${s.id})">${esc(s.title)}</div>`).join('')||'<span class="muted">Không có ca</span>'}</div>`}).join('')}
function task(s){const aa=D.assignments.filter(a=>a.shift===s.id),mine=aa.find(a=>a.person===D.user.id),accepted=aa.filter(a=>!['Hủy','Từ chối'].includes(a.status)).length;return `<article class="task">${tag(s.status)}<h3>${esc(s.title)}</h3><p>${esc(s.project)} · ${esc(s.location)}<br>${date(s.start)} – ${date(s.end)}<br>Phụ trách: ${esc(person(s.lead))}<br>${accepted}/${s.required} người ${accepted<s.required?'· ⚠ Chưa đủ người':''}</p><footer>${btn('Chi tiết',`taskDetail(${s.id})`)}${mine?.status==='Chờ xác nhận'?btn('Nhận ca',`act({action:'respond',id:${mine.id},status:'Đã nhận'})`,true)+btn('Từ chối',`decline(${mine.id})`):''}${mine&&['Đã nhận','Đang thực hiện'].includes(mine.status)?btn('Bàn giao',`resultForm(${s.id})`)+btn('Xin hủy',`requestForm('Hủy ca',${mine.id})`):''}${mgr()&&s.status!=='Hủy'?btn('Hủy ca',`cancelShift(${s.id})`):''}</footer></article>`}
function taskDetail(id){const s=D.shifts.find(x=>x.id===id);$('#modal').innerHTML=`<h2>${esc(s.title)}</h2><p>${esc(s.instructions)}</p><p>Bàn giao: ${esc(s.deliverable)}</p>${s.map&&/^https?:\/\//.test(s.map)?`<a href="${esc(s.map)}" target="_blank" rel="noopener">Mở bản đồ ↗</a>`:''}<h3>Nhóm tham gia</h3>${D.assignments.filter(a=>a.shift===id).map(a=>`<p>${esc(person(a.person))} ${a.person===s.lead?'· Phụ trách chính':'· Phối hợp'} ${tag(a.status)} ${esc(a.reason||'')}</p>`).join('')}${btn('Đóng',"document.querySelector('#modal').close()")}`;$('#modal').showModal()}

async function fileData(file){if(!file?.size)return '';if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>1500000)throw Error('Chọn ảnh JPG/PNG/WebP dưới 1,5 MB.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}

function resultForm(shift){modal('Gửi kết quả bàn giao','<label>Kết quả<textarea name="note" required></textarea></label><label>Ảnh bàn giao<input name="photo" type="file" accept="image/png,image/jpeg,image/webp"></label>',async f=>{try{act({action:'result',shift,note:f.get('note'),evidence:await fileData(f.get('photo'))})}catch(e){toast(e.message)}})}
function review(action,id,title,extra=''){modal(title,extra+select('accept','Quyết định',[[1,'Duyệt / xác nhận'],[0,'Từ chối']],1)+notes(),f=>act({action,id,accept:f.get('accept')==='1',reason:f.get('reason')}))}function resultReview(id){review('approveResult',id,'Xác nhận kết quả bàn giao')}function requestReview(id){review('approveRequest',id,'Xử lý yêu cầu')}function timeReview(id){const a=D.attendance.find(a=>a.id===id);modal('Duyệt số giờ công',field('hours','Giờ được duyệt',a.hours.toFixed(2),'number')+notes(),f=>act({action:'approveTime',id,hours:Number(f.get('hours')),reason:f.get('reason')}));$('#form input').step='0.01'}
function requestForm(kind='Nghỉ phép',id){const kinds=D.user.role==='contractor'?['Lịch rảnh/bận','Hủy ca','Điều chỉnh công']:['Nghỉ phép','Lịch rảnh/bận','Điều chỉnh công'];if(kind==='Hủy ca'&&!kinds.includes(kind))kinds.push(kind);modal('Gửi yêu cầu',select('kind','Loại',kinds.map(k=>[k,k]),kind)+`<div class="formgrid">${field('start','Từ ngày / thời điểm',kind==='Điều chỉnh công'?'':D.today,kind==='Điều chỉnh công'?'datetime-local':'date')}${field('end','Đến ngày / thời điểm',kind==='Điều chỉnh công'?'':D.today,kind==='Điều chỉnh công'?'datetime-local':'date')}</div>`+select('quantity','Số ngày nghỉ',[[1,'Cả ngày'],[0.5,'Nửa ngày']],1)+select('attendance','Lượt công cần điều chỉnh',[[0,'Không áp dụng'],...D.attendance.filter(a=>a.person===D.user.id).map(a=>[a.id,date(a.checkin)])],kind==='Điều chỉnh công'?id:0)+select('assignment','Ca cần hủy',[[0,'Không áp dụng'],...D.assignments.filter(a=>a.person===D.user.id).map(a=>[a.id,D.shifts.find(s=>s.id===a.shift)?.title])],kind==='Hủy ca'?id:0)+notes(),f=>{const b=Object.fromEntries(f);if(b.kind==='Điều chỉnh công'){b.start+=':00+07:00';b.end+=':00+07:00'}act({...b,action:'request',attendance:Number(b.attendance)||null,assignment:Number(b.assignment)||null})});$('#form select[name=kind]').onchange=e=>{const k=e.target.value;$('#modal').close();requestForm(k)}}
function paymentForm(id){modal('Cập nhật thanh toán',select('status','Trạng thái',['Tiền dự kiến','Đã duyệt thanh toán','Đã thanh toán'].map(s=>[s,s]))+notes(),f=>act({action:'payment',id,...Object.fromEntries(f)}))}function settingsForm(){modal('Cấu hình giờ công',field('hours','Giờ / ngày công',D.settings.hours,'number')+field('breakMinutes','Phút nghỉ',D.settings.breakMinutes,'number')+field('start','Giờ bắt đầu',D.settings.start,'time')+field('end','Giờ kết thúc',D.settings.end,'time'),f=>act({action:'settings',...Object.fromEntries(f),hours:Number(f.get('hours')),breakMinutes:Number(f.get('breakMinutes'))}))}
function exportCSV(){const rows=[['Nhân sự','Dự án','Ngày','Giờ duyệt','Thành tiền','Thanh toán'],...window.exportRows];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bang-cong.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function logout(){await api('logout',{});D=null;login()}api('data').then(d=>{D=d;render()}).catch(login);
</script></body></html>
